aid: kick
name: Kick
description: >-
  Kick is a self-driving, agentic bookkeeping platform for business owners and
  accounting firms — "an agentic ledger that does your books with you." It
  auto-categorizes bank and card transactions in real time (via Plaid), surfaces
  commonly missed deductions, supports customizable categorization rules, classes,
  multi-entity journal entries, reconciliation, and tax-ready financials (P&L,
  balance sheet, cash flow, tax package). Kick exposes a hosted, OAuth-secured
  Model Context Protocol (MCP) server at use.kick.co/mcp and a first-party CLI
  (@kickfinance/cli), letting AI agents in Claude, ChatGPT, and Gemini query and
  safely write to the books with preview-first confirmation. Backed by Felicis and
  General Catalyst.
