  oauth:
    protected_resource_metadata: https://use.kick.co/.well-known/oauth-protected-resource
    authorization_server_metadata: https://use.kick.co/.well-known/oauth-authorization-server
    authorization_endpoint: https://use.kick.co/mcp/oauth/authorize
    token_endpoint: https://use.kick.co/mcp/oauth/token
    registration_endpoint: https://use.kick.co/mcp/oauth/register
    revocation_endpoint: https://use.kick.co/mcp/oauth/revoke
    grant_types:
    - authorization_code
    - refresh_token
    code_challenge_methods:
    - S256
    access_token_lifetime_seconds: 3600
  scopes:
  - name: mcp:read
    description: Tool discovery and read-only calls.
  - name: mcp:write
    description: Tools that can change data (preview-first, confirmation required).
conventions:
  write_safety: All write tools are preview-first. Call the tool without a confirmationToken to receive
    a preview object plus a fresh token, then re-call with the identical input plus the returned confirmationToken
    to execute. Tokens are single-use and bound to the exact input.
  workspace_selection: Workspace-scoped tools accept a workspaceId argument. Workspace-bound PATs auto-inject
    their workspace; user-scoped PATs and OAuth tokens should pass workspaceId explicitly.
  backing_api: Every tool executes through the Kick REST API under the same auth, workspace, permission,
    and audit checks as the web app.
notes: Consolidated tool list — several tools handle multiple actions via an operation/report parameter,
  and the live list varies by token scope, workspace permissions, and enabled features. Tool names below
  are captured verbatim from the published Tool Reference; they are not derived from an OpenAPI spec (Kick
  publishes no public OpenAPI).
